<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figurinhas Copa 2026</title>

  <style>
    body {
      background: #0b1020;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 { color: #00ff99; }

    .hidden { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 20px;
    }

    .card {
      background: #141b34;
      padding: 15px;
      border-radius: 12px;
    }

    img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .buy { background: #00ff99; }
    .del { background: red; color: white; }
    .edit { background: orange; }
    .zap { background: #25D366; }
  </style>
</head>

<body>

<h1>Figurinhas Copa 2026</h1>

<div id="painelAdmin" class="hidden">
  <h2>Painel do dono</h2>

  <input id="codigo" placeholder="Código">
  <input id="nome" placeholder="Nome">
  <input id="preco" type="number" placeholder="Preço">
  <input id="estoque" type="number" placeholder="Estoque">
  <input id="foto" type="file">

  <button onclick="addFigurinha()">Adicionar</button>
</div>

<h2>Produtos</h2>
<div id="lista" class="grid"></div>

<h2>Carrinho</h2>
<div id="carrinho"></div>
<h3 id="total"></h3>
<button class="zap" onclick="finalizar()">Finalizar no WhatsApp</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjHAg_zIDJAYBOplwIXUozsZkN3jivnfQ",
  authDomain: "vendas-copa-2026.firebaseapp.com",
  projectId: "vendas-copa-2026",
  storageBucket: "vendas-copa-2026.firebasestorage.app",
  appId: "1:879990399653:web:c0136a5651167abd31e34c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 LINK SECRETO
const params = new URLSearchParams(window.location.search);
const dono = params.get("dono");

let adminLogado = false;
if (dono === "arthur2026") {
  adminLogado = true;
  document.getElementById("painelAdmin").classList.remove("hidden");
}

let figurinhas = [];
let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

// ADICIONAR
window.addFigurinha = async function() {
  const codigo = document.getElementById("codigo").value;
  const nome = document.getElementById("nome").value;
  const preco = Number(document.getElementById("preco").value);
  const estoque = Number(document.getElementById("estoque").value);
  const foto = document.getElementById("foto").files[0];

  const reader = new FileReader();

  reader.onload = async function(e) {
    await addDoc(collection(db, "figurinhas"), {
      codigo,
      nome,
      preco,
      estoque,
      foto: e.target.result
    });
    alert("Adicionado!");
  };

  reader.readAsDataURL(foto);
};

// LISTAR
onSnapshot(collection(db, "figurinhas"), (snapshot) => {
  figurinhas = [];
  document.getElementById("lista").innerHTML = "";

  snapshot.forEach(docItem => {
    const fig = docItem.data();
    fig.id = docItem.id;
    figurinhas.push(fig);

    document.getElementById("lista").innerHTML += `
      <div class="card">
        <img src="${fig.foto}">
        <h3>${fig.codigo} - ${fig.nome}</h3>
        <p>R$ ${fig.preco}</p>
        <p>Estoque: ${fig.estoque}</p>

        <button class="buy" onclick="addCarrinho('${fig.id}')">Comprar</button>

        ${
          adminLogado ? `
            <button class="edit" onclick="baixar('${fig.id}', ${fig.estoque})">-1 estoque</button>
            <button class="edit" onclick="aumentar('${fig.id}', ${fig.estoque})">+1 estoque</button>
            <button class="del" onclick="excluir('${fig.id}')">Excluir</button>
          ` : ""
        }
      </div>
    `;
  });
});

// ESTOQUE
window.baixar = async function(id, estoque) {
  if (estoque > 0) {
    await updateDoc(doc(db, "figurinhas", id), {
      estoque: estoque - 1
    });
  }
};

window.aumentar = async function(id, estoque) {
  await updateDoc(doc(db, "figurinhas", id), {
    estoque: estoque + 1
  });
};

window.excluir = async function(id) {
  await deleteDoc(doc(db, "figurinhas", id));
};

// CARRINHO
window.addCarrinho = function(id) {
  const item = figurinhas.find(f => f.id === id);
  carrinho.push(item);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderCarrinho();
};

function renderCarrinho() {
  let total = 0;
  const area = document.getElementById("carrinho");
  area.innerHTML = "";

  carrinho.forEach((item,i) => {
    total += item.preco;

    area.innerHTML += `
      <p>${item.nome} - R$ ${item.preco}</p>
      <button onclick="remover(${i})">Remover</button>
    `;
  });

  document.getElementById("total").innerText = "Total: R$ " + total;
}

window.remover = function(i) {
  carrinho.splice(i,1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  renderCarrinho();
};

// WHATS
window.finalizar = function() {
  let msg = "Quero comprar:%0A";

  carrinho.forEach(item => {
    msg += `${item.nome} - R$ ${item.preco}%0A`;
  });

  window.open(`https://wa.me/5562991606500?text=${msg}`);
};

renderCarrinho();

</script>

</body>
</html>
